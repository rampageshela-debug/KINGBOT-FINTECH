services:
  - type: web
    name: kingbot-fintech-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRADING_ENABLED
        value: false
      - key: APP_ORIGIN
        value: https://kingbot-fintech-ui.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kingbot-fintech-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: DEVELOPER_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false

  - type: static_site
    name: kingbot-fintech-ui
    plan: free
    region: frankfurt
    buildCommand: ""
    publishPath: public
